<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Bússola Digital - Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="top-bar"></div>

<header>
  <h1>Bússola Digital</h1>
  <nav>
    <a href="#">Início</a>
    <a href="./guia.html">Sobre</a>
    <a href="./interface.exe" download="interface.exe" class="chat-btn">💬 ChatDigital</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h2>Sua segurança digital <span>começa aqui</span></h2>
    <p>Teste seus conhecimentos com este quiz rápido sobre segurança digital e cidadania online.</p>
  </div>
  <img src="https://images.unsplash.com/photo-1510511459019-5dda7724fd87" alt="Segurança Digital">
</section>

<div class="quiz-container" id="quiz"></div>

<footer>
  © 2026 Bússola Digital
</footer>

<script>
const quizData = [
  {
    question: "1. O que é uma senha forte?",
    options: [
      "Seu nome e data de nascimento",
      "Uma sequência simples como 123456",
      "Uma combinação de letras, números e símbolos",
      "Apenas letras maiúsculas"
    ],
    correct: 2
  },
  {
    question: "2. O que você deve fazer ao receber um e-mail suspeito?",
    options: [
      "Clicar imediatamente",
      "Ignorar ou verificar antes de clicar",
      "Encaminhar para amigos",
      "Responder com seus dados"
    ],
    correct: 1
  },
  {
    question: "3. O que é phishing?",
    options: [
      "Um tipo de vírus",
      "Um ataque para roubar dados fingindo ser confiável",
      "Um antivírus",
      "Um jogo"
    ],
    correct: 1
  },
  {
    question: "4. Por que atualizar apps?",
    options: [
      "Ocupar espaço",
      "Melhorar segurança",
      "Ficar bonito",
      "Não é importante"
    ],
    correct: 1
  },
  {
    question: "5. Compartilhar dados pode ser perigoso porque:",
    options: [
      "Facilita golpes",
      "Todo mundo faz",
      "Não tem problema",
      "Só amigos veem"
    ],
    correct: 0
  },
  {
    question: "6. O que é 2FA?",
    options: [
      "Duas senhas iguais",
      "Sistema de verificação em duas etapas",
      "Dois celulares",
      "Login duplo"
    ],
    correct: 1
  },
  {
    question: "7. Wi-Fi público:",
    options: [
      "Usar sem preocupação",
      "Evitar acessar banco",
      "Compartilhar arquivos",
      "Desativar antivírus"
    ],
    correct: 1
  },
  {
    question: "8. Cidadania digital é:",
    options: [
      "Usar sem regras",
      "Só ter internet",
      "Uso responsável e seguro",
      "Postar qualquer coisa"
    ],
    correct: 2
  }
];

let score = 0;
let respondidas = 0;

const quiz = document.getElementById("quiz");


function iniciarQuiz() {
  quiz.innerHTML = ""; // Garante que o container estará limpo ao começar/recomeçar
  
  quizData.forEach((q, index) => {
    const div = document.createElement("div");
    div.classList.add("question");

    div.innerHTML = `<h3>${q.question}</h3>`;

    const optionsDiv = document.createElement("div");
    optionsDiv.classList.add("options");

    q.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.innerText = opt;

      btn.onclick = () => {
        if (i === q.correct) {
          btn.classList.add("correct");
          score++;
        } else {
          btn.classList.add("wrong");
        }

        const buttons = optionsDiv.querySelectorAll("button");
        buttons.forEach(b => b.disabled = true);

        respondidas++;

        if (respondidas === quizData.length) {
          showResult();
        }
      };

      optionsDiv.appendChild(btn);
    });

    div.appendChild(optionsDiv);
    quiz.appendChild(div);
  });
}

function showResult() {
  const wrapper = document.createElement("div");
  wrapper.classList.add("result-wrapper");

  const result = document.createElement("div");
  result.classList.add("result");
  

  result.innerHTML = `
    <div>⚡ 🖥️ <strong>Quiz Finalizado! Você teve um ótimo desempenho e acertou ${score} de ${quizData.length}!</strong></div>
    <button class="restart-btn" onclick="resetarQuiz()">🔄 Refazer Quiz</button>
  `;
  
  wrapper.appendChild(result);
  quiz.appendChild(wrapper);
  
  result.scrollIntoView({ behavior: 'smooth' });
}

function resetarQuiz() {
  score = 0;
  respondidas = 0;
  iniciarQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' }); 
}

iniciarQuiz();
</script>

</body>
</html>
